services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: tutor-service
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 6201
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
